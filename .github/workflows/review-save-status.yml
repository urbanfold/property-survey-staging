name: Review staging save-status correction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Check save-status transitions
        run: node --test tests/test_save_status.mjs

      - name: Check staging administrator export access
        run: node tests/test_staging_admin_export_identity.cjs
      - name: Check saved-survey PDF read-only flow
        run: node --test tests/test_saved_survey_pdf.mjs
